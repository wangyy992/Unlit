<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>暗室 · 小游戏</title>
<meta name="description" content="一个纯静态的休闲游戏站。原生 JS + Canvas，打开就能玩，不用下载不用注册。">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<header class="site-head">
  <h1>暗室</h1>
  <p>打开就能玩的小游戏。没有下载，没有注册，没有广告。</p>
</header>

<main>
  <ul class="cards">
    <li class="card">
      <a href="games/light-and-shadow/index.html">
        <div class="thumb thumb-ls" aria-hidden="true">
          <span class="orb lumen"></span>
          <span class="orb umbra"></span>
        </div>
        <div class="body">
          <h2>光与影</h2>
          <p class="tagline">双人合作解谜 · 5 关</p>
          <p class="desc">光灵只能待在光里，影灵只能待在暗处。推动一盏灯，就同时改变了两个人的路。一个键盘，两个人。</p>
          <p class="meta">键盘 · 双人同屏</p>
        </div>
      </a>
    </li>

    <li class="card soon">
      <div class="thumb thumb-soon" aria-hidden="true">?</div>
      <div class="body">
        <h2>下一款</h2>
        <p class="tagline">还在做</p>
        <p class="desc">下一个想做的是「回响」：你死后重生，上一条命会变成幽灵，精确重复你之前的每一个操作。要按住两个相隔很远的机关，就得和过去的自己配合。</p>
        <p class="meta">敬请期待</p>
      </div>
    </li>
  </ul>
</main>

<footer class="site-foot">
  <p>纯静态站点 · 原生 JS + Canvas · 无依赖</p>
</footer>
</body>
</html>
